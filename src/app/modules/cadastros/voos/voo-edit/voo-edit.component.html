<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden bg-card dark:bg-transparent">

    <!-- Header -->
    <div
        class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-8 px-6 md:px-8 border-b">

        <!-- Loader -->
        <div class="absolute inset-x-0 bottom-0" *ngIf="isLoading">
            <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
        </div>

        <!-- Title -->
        <div class="text-4xl font-extrabold tracking-tight">
            Novo Voo
        </div>

        <!-- Actions -->
        <div class="flex flex-shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <button class="ml-4" mat-flat-button [color]="'primary'" (click)="voltar()">
                <span class="ml-2 mr-1">Cancelar</span>
            </button>
            <button class="ml-4" mat-flat-button [color]="'primary'" (click)="save()">
                <span class="ml-2 mr-1">Salvar</span>
            </button>
        </div>
    </div>

    <!-- Main -->

    <form [formGroup]="mainForm" class="flex flex-col overflow-y-scroll overflow-x-hidden p-8">
        <div class="flex flex-row">
            <mat-form-field class="flex-1">
                <mat-label>Data</mat-label>
                <input matInput formControlName="data" type="date">
                <mat-error *ngIf="this.mainForm.get('data').invalid">Campo obrigatório</mat-error>
            </mat-form-field>

            <mat-form-field class="flex-1 ml-2">
                <mat-label>Descrição</mat-label>
                <select matNativeControl required formControlName="descricao">
                    <option value="Doorsoff"> Doorsoff</option>
                    <option value="Panoramico 15min"> Panoramico 15min</option>
                    <option value="Panoramico 20min"> Panoramico 20min</option>
                    <option value="Panoramico 30min"> Panoramico 30min</option>
                    <option value="Panoramico 45min"> Panoramico 45min</option>
                    <option value="Panoramico 60min"> Panoramico 60min</option>
                    <option value="Translado"> Translado</option>
                </select>
                <mat-error *ngIf="this.mainForm.get('descricao').invalid">Campo obrigatório</mat-error>
            </mat-form-field>
        </div>

        <div class="flex flex-row">
            <mat-form-field class="flex-1">
                <mat-label>Horímetro Inicial</mat-label>
                <input matInput formControlName="horimetroInicial" type="number">
                <mat-error *ngIf="this.mainForm.get('horimetroInicial').invalid">Campo obrigatório</mat-error>
            </mat-form-field>
    
            <mat-form-field class="flex-1 ml-2">
                <mat-label>Horímetro Final</mat-label>
                <input matInput formControlName="horimetroFinal" type="number">
                <mat-error *ngIf="this.mainForm.get('horimetroFinal').invalid">Campo obrigatório</mat-error>
            </mat-form-field>

            <mat-form-field class="flex-1 ml-2">
                <mat-label>Horímetro Total</mat-label>
                <input matInput formControlName="totalHorimetro" type="number">
                <mat-error *ngIf="this.mainForm.get('totalHorimetro').invalid">Campo obrigatório</mat-error>
            </mat-form-field>
        </div>

        <div class="flex flex-row">
            <mat-form-field class="flex-1">
                <mat-label>Empresa</mat-label>
                <select matNativeControl required formControlName="empresa">
                    <option value="4FLY RJ"> 4FLY RJ</option>
                    <option value="Diogo"> Diogo</option>
                    <option value="Gonzalez"> Gonzalez</option>
                </select>
            </mat-form-field>
    
             <mat-form-field class="flex-1 ml-2">
                <mat-label>Piloto</mat-label>
                <select matNativeControl required formControlName="piloto">
                    <option *ngFor="let tripulante of tripulantes" value="{{tripulante.nome}}">{{ tripulante.nome }}</option>
                </select>
            </mat-form-field>

            <mat-form-field class="flex-1 ml-2">
                <mat-label>Valor</mat-label>
                <input matInput formControlName="valor" type="number">
                <mat-error *ngIf="this.mainForm.get('valor').invalid">Campo obrigatório</mat-error>
            </mat-form-field>

            <mat-form-field class="flex-1 ml-2">
                <mat-label>Status Voo</mat-label>
                <select matNativeControl required formControlName="statusPgtoVoo">
                    <option value="pendente"> Pendente</option>
                    <option value="pago"> Pago</option>
                </select>
            </mat-form-field>

            <mat-form-field class="flex-1 ml-2">
                <mat-label>Status Piloto</mat-label>
                <select matNativeControl formControlName="statusPgtoPiloto">
                    <option value="pendente"> Pendente</option>
                    <option value="pago"> Pago</option>
                </select>
            </mat-form-field>
        </div>

    </form>

</div>
